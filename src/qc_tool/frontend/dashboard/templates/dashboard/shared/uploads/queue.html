<div class="qc-upload-queue" data-upload-queue hidden>
    <div class="qc-upload-toolbar qc-upload-toolbar--queue">
        <p class="qc-upload-summary" data-upload-queue-summary></p>
        <button type="button" class="btn btn-primary btn-qc-primary" data-upload-add-all aria-describedby="upload-batch-description" hidden>Add all</button>
    </div>
    <p id="upload-batch-description" class="qc-upload-hint" data-upload-batch-description hidden></p>
    <ul class="qc-upload-list" data-upload-list aria-label="Files to add"></ul>
    <p class="qc-upload-hint" data-upload-queue-hint hidden>Keep this page open until all files finish uploading.</p>
</div>
<div class="qc-upload-feedback" data-upload-feedback></div>
