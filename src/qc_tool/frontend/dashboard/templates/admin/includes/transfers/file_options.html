<fieldset class="transfer-scopes transfer-file-options">
  <legend>Include the package's files?</legend>
  {{ file_field.errors }}
  {% for radio in file_field %}
  <label class="transfer-scope">{{ radio.tag }}<span><strong>{{ radio.choice_label }}</strong><span class="transfer-secondary">{% if radio.data.value == 'true' %}Copy verified package files, such as boundaries, deliveries and reports. Matching files already on this server can be reused.{% else %}Import the database contents without copying package files. Matching files already on this server can still be used.{% endif %}</span></span></label>
  {% endfor %}
  <p class="help">This choice changes files only. A full database restore still includes all database records. You will review missing files before confirming.</p>
</fieldset>
