{% load static %}
{% if messages %}
<div class="account-messages{% if inline_messages %} account-messages--inline{% endif %}" aria-label="Notifications">
    {% for message in messages %}
    <div
        class="alert {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}alert-danger{% elif message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}alert-success{% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}alert-warning{% else %}alert-info{% endif %}"
        role="{% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}alert{% else %}status{% endif %}"
        aria-live="{% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}assertive{% else %}polite{% endif %}"
        aria-atomic="true"
    >
        <svg class="ui-icon account-message__icon" aria-hidden="true" focusable="false">
            <use href="{% static 'dashboard/icons/ui.svg' %}#{% if message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}check-circle{% elif message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}x-circle{% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}alert-triangle{% else %}bell{% endif %}"></use>
        </svg>
        <span class="account-message__text">{{ message }}</span>
        <button class="account-message__dismiss" type="button" data-dismiss="alert" aria-label="Dismiss notification">
            <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
