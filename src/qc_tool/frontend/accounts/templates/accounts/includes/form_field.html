<div class="form-group{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
    <div id="{{ field.auto_id }}_helptext" class="help-block">{{ field.help_text }}</div>
    {% endif %}
    {% if field.errors %}
    <div class="account-field-errors"{% if errors_id %} id="{{ errors_id }}"{% endif %} role="alert">{{ field.errors }}</div>
    {% endif %}
</div>
