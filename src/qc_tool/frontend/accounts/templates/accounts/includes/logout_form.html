{% load static %}
<li class="navbar-logout">
    <form method="post" action="{% url 'logout' %}" data-maintenance-write>
<fieldset class="qc-maintenance-fields" data-maintenance-write{% if maintenance.enabled %} disabled{% endif %}>
        {% csrf_token %}
        <button type="submit">
            <svg class="ui-icon" aria-hidden="true" focusable="false">
                <use href="{% static 'dashboard/icons/ui.svg' %}#log-out"></use>
            </svg>
            <span class="navbar-logout-label">Log out</span>
        </button>
    </fieldset>
</form>
</li>
