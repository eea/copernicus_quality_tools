{% load static %}
<aside class="error-help" aria-labelledby="error-help-title">
    <div class="error-help-intro">
        <span class="error-help-icon" aria-hidden="true">
            <svg class="error-icon" focusable="false">
                <use href="{% static 'accounts/icons/error-ui.svg' %}#book"></use>
            </svg>
        </span>
        <div>
            <h2 id="error-help-title">Need help?</h2>
            <p>
                Check our documentation for more information or contact
                support if you need assistance.
            </p>
        </div>
    </div>

    <a
        class="error-help-link"
        href="https://eea.github.io/copernicus_quality_tools/"
    >
        <span class="error-help-icon error-help-icon-small" aria-hidden="true">
            <svg class="error-icon" focusable="false">
                <use href="{% static 'accounts/icons/error-ui.svg' %}#book"></use>
            </svg>
        </span>
        <span class="error-help-copy">
            <strong>Documentation</strong>
            <span>Browse guides and user documentation</span>
        </span>
        <svg class="error-icon error-help-chevron" aria-hidden="true" focusable="false">
            <use href="{% static 'accounts/icons/error-ui.svg' %}#chevron-right"></use>
        </svg>
    </a>

    <a
        class="error-help-link"
        href="https://github.com/eea/copernicus_quality_tools/issues"
    >
        <span class="error-help-icon error-help-icon-small" aria-hidden="true">
            <svg class="error-icon" focusable="false">
                <use href="{% static 'accounts/icons/error-ui.svg' %}#mail"></use>
            </svg>
        </span>
        <span class="error-help-copy">
            <strong>Contact support</strong>
            <span>Get in touch with our team and we’ll help you</span>
        </span>
        <svg class="error-icon error-help-chevron" aria-hidden="true" focusable="false">
            <use href="{% static 'accounts/icons/error-ui.svg' %}#chevron-right"></use>
        </svg>
    </a>
</aside>
