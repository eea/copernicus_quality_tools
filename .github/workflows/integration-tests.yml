name: Integration Tests

on:
  push:
    branches: ["dev", "master"]
  pull_request:
    branches: ["dev"]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose -f docker-compose.service_provider.yml up -d --build

      - name: Wait for API Ready
        run: |
          echo "Waiting for API to respond on port 8000..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/delivery-list || true)
            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 403 ]; then
              echo "API is up! (Received HTTP $STATUS)"
              exit 0
            fi
            sleep 1
          done
          echo "Error: API failed to respond with 200 or 403 within 30 seconds."
          exit 1

      - name: Test API Endpoint
        run: |
          echo "Fetching delivery list..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/delivery-list || true)
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 403 ]; then
            echo "SUCCESS: API Endpoint test passed (HTTP $STATUS)"
          else
            echo "FAILURE: API Endpoint test failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Run Worker Unit Tests
        run: |
          echo "Running Worker Unit Tests..."
          docker compose -f docker-compose.service_provider.yml exec -T \
            -e SKIP_INSPIRE_CHECK=yes \
            -e PYTHONWARNINGS="ignore" \
            worker \
            python3 -c '
import logging, unittest
logging.disable(logging.CRITICAL)
suite = unittest.defaultTestLoader.discover(
    "/usr/local/src/copernicus_quality_tools/src/qc_tool/test",
    top_level_dir="/usr/local/src/copernicus_quality_tools/src"
)
runner = unittest.TextTestRunner(verbosity=2, buffer=True)
result = runner.run(suite)
exit(0 if result.wasSuccessful() else 1)
'

      - name: Run Frontend Dashboard Tests
        run: |
          echo "Running Frontend Dashboard Tests..."
          docker compose -f docker-compose.service_provider.yml exec -T \
            --workdir /usr/local/src/copernicus_quality_tools/src/qc_tool/frontend \
            frontend \
            python3 manage.py test dashboard.tests -v 2

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.service_provider.yml down
