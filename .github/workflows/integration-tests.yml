name: QC Tool integration tests
run-name: >-
  ${{ github.ref_type == 'tag' && format('Release tag: {0}', github.ref_name) || format('{0}: {1}', github.event_name, github.ref_name) }}

on:
  push:
    branches: ["master", "dev", "release/**"]
    tags: ["**"]
  pull_request:
    branches: ["master", "dev", "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  TEST_IMAGE: qc-tool-frontend-ci:${{ github.sha }}
  TEST_WORKER_IMAGE: qc-tool-worker-ci:${{ github.sha }}

jobs:
  source:
    name: Source and shared checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate workflow syntax and shell commands
        run: |
          for ci_script in scripts/ci/*.sh scripts/ci/browser/run.sh; do
            bash -n "$ci_script"
          done
          for ci_script in scripts/ci/browser/*.cjs; do
            node --check "$ci_script"
          done
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Verify source policy, JavaScript and deployment manifests
        run: bash scripts/ci/source.sh

  worker-control:
    name: Worker admission and interruption
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install worker HTTP adapter
        run: python3 -m pip install bottle==0.13.4
      - name: Verify maintenance protocol and process groups
        run: >-
          PYTHONPATH=src python3 -m unittest
          qc_tool.test.test_maintenance_protocol
          qc_tool.test.test_worker_auth
          qc_tool.test.test_worker_maintenance
          qc_tool.test.test_worker_scheduler
          qc_tool.test.test_worker_service_auth
          qc_tool.test.test_storage_guard

  tooling:
    name: Maintainer tools (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify maintainer tools and release guards
        run: |
          python3 -m pip install supervisor==4.3.0
          python3 -m unittest discover -s scripts/tests -t . -v

  frontend-build:
    name: Packaged frontend
    needs: [source, worker-control, tooling]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the supported frontend once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.frontend
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            VERSION=${{ env.SOURCE_VERSION }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=qc-tool-frontend
          cache-to: type=gha,scope=qc-tool-frontend,mode=max,ignore-error=true
      - name: Verify shipped dependencies and real Gunicorn behavior
        run: bash scripts/ci/frontend.sh runtime
      - name: Verify production security settings
        run: bash scripts/ci/frontend.sh deployment
      - name: Export the verified image and provenance
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-image"
          docker save --output "$RUNNER_TEMP/frontend-image/frontend.tar" "$TEST_IMAGE"
          python3 scripts/ci/release/verify.py image-metadata \
            --component frontend --image "$TEST_IMAGE" \
            --source-sha "$GITHUB_SHA" --source-version "$SOURCE_VERSION" \
            --output "$RUNNER_TEMP/frontend-image/metadata.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-image
          path: ${{ runner.temp }}/frontend-image/
          overwrite: true
          retention-days: 2
          compression-level: 1
          if-no-files-found: error

  frontend:
    name: Frontend (${{ matrix.database }})
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      # Application database and native backup clients share PostgreSQL major 14.
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: qc_tool_schema_ci
          POSTGRES_USER: qc_tool_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qc_tool_ci -d qc_tool_schema_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_ENGINE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-image
          path: ${{ runner.temp }}/frontend-image
      - name: Load the exact image from the build job
        run: docker load --input "$RUNNER_TEMP/frontend-image/frontend.tar"
      - name: Verify schema, static files and full application suite
        run: bash scripts/ci/frontend.sh database

  browser:
    name: Browser uploads (${{ matrix.storage }})
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        storage: [volume, bind]
    env:
      STORAGE_MODE: ${{ matrix.storage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-image
          path: ${{ runner.temp }}/frontend-image
      - name: Load the exact image from the build job
        run: docker load --input "$RUNNER_TEMP/frontend-image/frontend.tar"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/ci/browser/package-lock.json
      - name: Install the locked browser test runtime
        run: |
          npm --prefix scripts/ci/browser ci
          npx --prefix scripts/ci/browser playwright install --with-deps chromium firefox
      - name: Exercise file selection and uploads in Firefox and Chromium
        env:
          QC_TOOL_BROWSER_ARTIFACTS_DIR: ${{ runner.temp }}/browser-${{ matrix.storage }}
        run: bash scripts/ci/browser/run.sh
      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ matrix.storage }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-${{ matrix.storage }}/
          retention-days: 7
          if-no-files-found: ignore

  worker-runtime:
    name: Supported worker image and QC regressions
    needs: [source, worker-control, tooling]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the supported worker runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.worker
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_WORKER_IMAGE }}
          build-args: |
            VERSION=${{ env.SOURCE_VERSION }}
            SOURCE_REVISION=${{ github.sha }}
            BUILD_JOBS=2
          cache-from: type=gha,scope=qc-tool-worker
          # Preserve the native compiler stages as well as the final runtime.
          cache-to: type=gha,scope=qc-tool-worker,mode=max,ignore-error=true
      - name: Verify runtime, Supervisor and full QC regressions
        run: bash scripts/ci/worker.sh
      - name: Export the tested worker for a possible manual tag release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          mkdir -p "$RUNNER_TEMP/worker-image"
          docker save "$TEST_WORKER_IMAGE" | gzip -1 > "$RUNNER_TEMP/worker-image/worker.tar.gz"
          python3 scripts/ci/release/verify.py image-metadata \
            --component worker --image "$TEST_WORKER_IMAGE" \
            --source-sha "$GITHUB_SHA" --source-version "$SOURCE_VERSION" \
            --output "$RUNNER_TEMP/worker-image/metadata.json"
      - name: Retain the tested release worker
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-image
          path: ${{ runner.temp }}/worker-image/
          overwrite: true
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

  ci:
    name: CI
    if: always()
    needs: [source, worker-control, tooling, frontend-build, frontend, browser, worker-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every prerequisite to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_results.py
