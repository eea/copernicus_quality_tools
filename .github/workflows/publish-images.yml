name: Publish verified QC Tool images

# Opt-in replacement for Docker Hub autobuild, never a second automatic publisher.
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful tag-push integration-test run ID (artifacts retained for two days)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: qc-tool-image-publication
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish tested frontend and worker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub-release
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QC_TOOL_IMAGE_PUBLISHER: ${{ vars.QC_TOOL_IMAGE_PUBLISHER }}
    steps:
      - name: Require the configured publisher and trusted workflow branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$QC_TOOL_IMAGE_PUBLISHER" = github-actions || {
            echo 'First configure dockerhub-release and disable Docker Hub autobuild; see the release guide.' >&2
            exit 1
          }
          test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH" || {
            echo 'Run publication from the reviewed default branch.' >&2
            exit 1
          }
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify successful tag CI, unchanged source and retained artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          python3 scripts/ci/release/verify.py run \
            --repository "$GITHUB_REPOSITORY" --run-id "$CI_RUN_ID" \
            --output "$RUNNER_TEMP/release.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-image
          path: ${{ runner.temp }}/frontend-image
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-image
          path: ${{ runner.temp }}/worker-image
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Load tested images without rebuilding
        run: |
          docker load --input "$RUNNER_TEMP/frontend-image/frontend.tar"
          docker load --input "$RUNNER_TEMP/worker-image/worker.tar.gz"
      - name: Authenticate only for this protected publication
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish unchanged tested images and verify their registry digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/release/publish.py \
            --release "$RUNNER_TEMP/release.json" \
            --frontend-metadata "$RUNNER_TEMP/frontend-image/metadata.json" \
            --worker-metadata "$RUNNER_TEMP/worker-image/metadata.json" \
            --output "$RUNNER_TEMP/published-images.json"
      - name: Retain the verified image-pair record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-images.json
          retention-days: 90
          if-no-files-found: error
