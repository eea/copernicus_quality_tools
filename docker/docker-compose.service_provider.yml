services:
  frontend:
    image: eeacms/copernicus-qctool-frontend:2.4.7rc4
    ports:
      - 8000:8000
    environment:
      - PRODUCT_DIRS
      - BOUNDARY_DIR=/mnt/qc_tool_volume/boundaries
      - INCOMING_DIR=/mnt/qc_tool_volume/incoming
      - WORK_DIR=/mnt/qc_tool_volume/work
      - SUBMISSION_DIR=
      - FRONTEND_DB_PATH=/mnt/qc_tool_volume/frontend.sqlite3
      - UPDATE_JOB_STATUSES=yes
      - UPDATE_JOB_STATUSES_INTERVAL=30000
      - WORKER_ALIVE_TIMEOUT=5
      - REFRESH_JOB_STATUSES_BACKGROUND=yes
      - REFRESH_JOB_STATUSES_BACKGROUND_INTERVAL=60
      - CSRF_TRUSTED_ORIGINS=https://qc-copernicus.eea.europa.eu,http://localhost,http://127.0.0.1
      - RESUMABLE_SIMULTANEOUS_UPLOADS=4
      - S3_ALLOWED_ENDPOINTS
      - S3_CREDENTIALS_DIR
      - S3_CONNECT_TIMEOUT_SECONDS
      - S3_READ_TIMEOUT_SECONDS
      - S3_MAX_LISTED_OBJECTS
      - QC_TOOL_ENVIRONMENT=production
      - DJANGO_SECRET_KEY
      - DJANGO_ALLOWED_HOSTS=qc-copernicus.eea.europa.eu
      - DJANGO_SECURE_HSTS_SECONDS=31536000
      - DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=yes
    networks:
      - qc_tool_network
    volumes:
      - qc_tool_volume:/mnt/qc_tool_volume

  worker:
    image: eeacms/copernicus-qctool-worker:2.4.7rc4
    shm_size: 1gb
    environment:
      - PRODUCT_DIRS
      - BOUNDARY_DIR=/mnt/qc_tool_volume/boundaries
      - INCOMING_DIR=/mnt/qc_tool_volume/incoming
      - PULL_JOB_URL=http://frontend:8000/pull_job
      - WORK_DIR=/mnt/qc_tool_volume/work
      - INSPIRE_SERVICE_URL=http://localhost:8080/validator/v2/
      - JAVA_MAX_MEM=1536
      - RUN_INSPIRE_VALIDATOR=no
      - USE_LIGHTWEIGHT_VALIDATOR=yes
      - RUN_POSTGRES=yes
      - S3_ALLOWED_ENDPOINTS
      - S3_CONNECT_TIMEOUT_SECONDS
      - S3_READ_TIMEOUT_SECONDS
      - S3_MAX_LISTED_OBJECTS
      - S3_MAX_DOWNLOAD_BYTES
    networks:
      - qc_tool_network
    volumes:
      - qc_tool_volume:/mnt/qc_tool_volume

volumes:
  qc_tool_volume:
    driver: local

networks:
  qc_tool_network:
    driver: bridge
