# Local development stack. Run from the repository root with:
#   docker compose -f docker/compose.local.yaml up --build
#
# Python, templates, static assets, and product definitions are bind-mounted
# from this checkout. Django reloads frontend changes automatically; worker QC
# modules are loaded by each new job. Restart the worker after editing its
# long-lived scheduler:
#   docker compose -f docker/compose.local.yaml restart worker
#
# Add docker/compose.local.debug.yaml to the command to enable the frontend
# debugpy listener used by .vscode/launch.json.
# Set QC_TOOL_BOUNDARY_PATH to the host directory containing the boundary
# package's raster/ and vector/ directories.
# check https://github.com/eea/copernicus_quality_tools/wiki/Boundaries
# and example - https://github.com/eea/copernicus_quality_tools/releases/tag/2.4.7 (where boundaries are stored on GDrive)

name: copernicus-quality-tools-local

services:
  userdb:
    image: postgres:14
    pull_policy: missing
    environment:
      POSTGRES_DB: "${QC_TOOL_POSTGRES_DB:-qc_tool}"
      POSTGRES_USER: "${QC_TOOL_POSTGRES_USER:-qc_user}"
      POSTGRES_PASSWORD: "${QC_TOOL_POSTGRES_PASSWORD:-qc_password}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.local
      args:
        VERSION: "${QC_TOOL_IMAGE_TAG:-2.4.7}"
        DEBUGPY_VERSION: "${QC_TOOL_DEBUGPY_VERSION:-1.8.12}"
    # Published QC Tool images are currently linux/amd64-only. Docker Desktop
    # uses emulation on ARM hosts; the variable allows future native images.
    platform: "${QC_TOOL_PLATFORM:-linux/amd64}"
    init: true
    depends_on:
      userdb:
        condition: service_healthy
        restart: true
    ports:
      - name: frontend-http
        target: 8000
        published: "${QC_TOOL_PORT:-8000}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      QC_TOOL_DEBUG: "no"
      QC_TOOL_DEBUG_PORT: "5678"
      PRODUCT_DIRS: /usr/local/src/copernicus_quality_tools/product_definitions
      BOUNDARY_DIR: /mnt/qc_tool_boundary/boundaries
      INCOMING_DIR: /mnt/qc_tool_incoming/incoming
      WORK_DIR: /mnt/qc_tool_work/work
      SUBMISSION_DIR: /mnt/qc_tool_submission/submission
      DB_ENGINE: postgres
      POSTGRES_HOST: userdb
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${QC_TOOL_POSTGRES_DB:-qc_tool}"
      POSTGRES_USER: "${QC_TOOL_POSTGRES_USER:-qc_user}"
      POSTGRES_PASSWORD: "${QC_TOOL_POSTGRES_PASSWORD:-qc_password}"
      API_URL: "http://localhost:${QC_TOOL_PORT:-8000}/api"
      UPDATE_JOB_STATUSES: "yes"
      UPDATE_JOB_STATUSES_INTERVAL: "30000"
      WORKER_ALIVE_TIMEOUT: "20"
      REFRESH_JOB_STATUSES_BACKGROUND: "yes"
      REFRESH_JOB_STATUSES_BACKGROUND_INTERVAL: "60"
      MAINTENANCE_MODE: "no"
      CASE_INSENSITIVE_USERNAMES: "yes"
      CSRF_TRUSTED_ORIGINS: "http://localhost:${QC_TOOL_PORT:-8000},http://127.0.0.1:${QC_TOOL_PORT:-8000}"
      RESUMABLE_SIMULTANEOUS_UPLOADS: "4"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login/', timeout=2).close()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - type: bind
        source: "${QC_TOOL_BOUNDARY_PATH:?Set QC_TOOL_BOUNDARY_PATH to the boundary package directory}"
        target: /mnt/qc_tool_boundary/boundaries
        bind:
          create_host_path: false
      - type: volume
        source: qc_tool_incoming
        target: /mnt/qc_tool_incoming
      - type: volume
        source: qc_tool_work
        target: /mnt/qc_tool_work
      - type: volume
        source: qc_tool_submission
        target: /mnt/qc_tool_submission
      - type: volume
        source: qc_tool_frontend
        target: /var/lib/qc_tool
      # The checkout overlays the code packaged in the image, so source edits
      # are available immediately without rebuilding an image.
      - type: bind
        source: ..
        target: /usr/local/src/copernicus_quality_tools
        read_only: true
        bind:
          create_host_path: false

  worker:
    image: "eeacms/copernicus-qctool-worker:${QC_TOOL_IMAGE_TAG:-2.4.7}"
    platform: "${QC_TOOL_PLATFORM:-linux/amd64}"
    pull_policy: missing
    init: true
    shm_size: "1gb"
    depends_on:
      frontend:
        condition: service_healthy
        restart: true
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PRODUCT_DIRS: /usr/local/src/copernicus_quality_tools/product_definitions
      BOUNDARY_DIR: /mnt/qc_tool_boundary/boundaries
      INCOMING_DIR: /mnt/qc_tool_incoming/incoming
      WORK_DIR: /mnt/qc_tool_work/work
      PULL_JOB_URL: http://frontend:8000/pull_job
      INSPIRE_SERVICE_URL: http://localhost:8080/validator/v2/
      # Lightweight validation keeps the local feedback loop fast. Set these
      # two QC_TOOL_* variables to yes/no respectively for the full validator.
      RUN_INSPIRE_VALIDATOR: "${QC_TOOL_RUN_INSPIRE_VALIDATOR:-no}"
      USE_LIGHTWEIGHT_VALIDATOR: "${QC_TOOL_USE_LIGHTWEIGHT_VALIDATOR:-yes}"
      RUN_POSTGRES: "yes"
      # Preserve temporary job data in development unless explicitly disabled.
      LEAVE_SCHEMA: "${LEAVE_SCHEMA:-yes}"
      LEAVE_JOBDIR: "${LEAVE_JOBDIR:-yes}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:8000/max_slots.json >/dev/null &&
          pg_isready -q -h 127.0.0.1 -p 5432 -U qc_job -d qc_tool_db &&
          { [ "$$RUN_INSPIRE_VALIDATOR" = "no" ] ||
          curl -fsS http://localhost:8080/validator/v2/status >/dev/null; }
      interval: 10s
      timeout: 5s
      retries: 30
      # A successful lightweight check becomes healthy during start_period;
      # the longer allowance is for opt-in full validation under emulation.
      start_period: 180s
    volumes:
      - type: bind
        source: "${QC_TOOL_BOUNDARY_PATH:?Set QC_TOOL_BOUNDARY_PATH to the boundary package directory}"
        target: /mnt/qc_tool_boundary/boundaries
        bind:
          create_host_path: false
      - type: volume
        source: qc_tool_incoming
        target: /mnt/qc_tool_incoming
      - type: volume
        source: qc_tool_work
        target: /mnt/qc_tool_work
      - type: bind
        source: ..
        target: /usr/local/src/copernicus_quality_tools
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres_data:
  qc_tool_frontend:
  qc_tool_incoming:
  qc_tool_submission:
  qc_tool_work:
