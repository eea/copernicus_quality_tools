# Self-contained local stack; no external Compose fragments are required.
name: copernicus-quality-tools-local

services:
  userdb:
    image: postgres:17
    pull_policy: missing
    ports:
      - "127.0.0.1:${QC_TOOL_POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${QC_TOOL_POSTGRES_DB:-qc_tool}"
      POSTGRES_USER: "${QC_TOOL_POSTGRES_USER:-qc_user}"
      POSTGRES_PASSWORD: "${QC_TOOL_POSTGRES_PASSWORD:-qc_password}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres17_data_v3:/var/lib/postgresql/data

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VERSION: "${QC_TOOL_SOURCE_VERSION:-development}"
    image: "copernicus-qctool-frontend-local:${QC_TOOL_IMAGE_TAG:-dev}"
    init: true
    # Source and startup checks both come from the mounted checkout.
    command: ["sh", "/usr/local/src/copernicus_quality_tools/docker/run_frontend.sh"]
    pull_policy: missing
    depends_on:
      userdb:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${QC_TOOL_PORT:-8000}:8000"
    environment:
      QC_TOOL_DATA_ROOT: /mnt/qc-tool/data
      QC_TOOL_REQUIRE_MOUNTS: "yes"
      QC_TOOL_STORAGE_ROLE: frontend
      DB_ENGINE: postgres
      POSTGRES_HOST: userdb
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${QC_TOOL_POSTGRES_DB:-qc_tool}"
      POSTGRES_USER: "${QC_TOOL_POSTGRES_USER:-qc_user}"
      POSTGRES_PASSWORD: "${QC_TOOL_POSTGRES_PASSWORD:-qc_password}"
      API_URL: "http://localhost:${QC_TOOL_PORT:-8000}/api"
      CASE_INSENSITIVE_USERNAMES: "yes"
      WORKER_ALIVE_TIMEOUT: "20"
      CSRF_TRUSTED_ORIGINS: "http://localhost:${QC_TOOL_PORT:-8000},http://127.0.0.1:${QC_TOOL_PORT:-8000}"
      QC_TOOL_ENVIRONMENT: development
      DJANGO_DEBUG: "no"
      DJANGO_SECRET_KEY: development-only-compose-secret
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,frontend,testserver"
      QC_TOOL_BOOTSTRAP_DEMO_USERS: "${QC_TOOL_BOOTSTRAP_DEMO_USERS:-yes}"
      QC_TOOL_INITIALIZE_ON_STARTUP: "${QC_TOOL_INITIALIZE_ON_STARTUP:-yes}"
      QC_TOOL_DEV_SERVER: "${QC_TOOL_DEV_SERVER:-yes}"
      # Existing deployment overrides; absent values use application defaults.
      PRODUCT_DIRS:
      QC_TOOL_RESTORE_DATABASE:
      QC_TOOL_STORAGE_ROOTS:
      QC_TOOL_STORAGE_SFTP_HOST:
      QC_TOOL_STORAGE_SFTP_PORT:
      QC_TOOL_STORAGE_SFTP_USERNAME:
      QC_TOOL_STORAGE_SFTP_ROOT:
      QC_TOOL_TRANSFER_DIR:
      QC_TOOL_BACKUPS_DIR:
      QC_TOOL_UPLOAD_TEMP_DIR:
      S3_CREDENTIALS_DIR: "${S3_CREDENTIALS_DIR:-/var/lib/qc_tool/s3_credentials}"
      QC_TOOL_TRANSFER_MAX_RECORDS:
      QC_TOOL_TRANSFER_MAX_ARCHIVE_BYTES:
      QC_TOOL_TRANSFER_MAX_EXPANDED_BYTES:
      QC_TOOL_TRANSFER_MAX_MEMBER_BYTES:
      QC_TOOL_TRANSFER_MIN_FREE_BYTES:
      QC_TOOL_POSTGRES_TOOL_TIMEOUT:
      S3_ALLOWED_ENDPOINTS:
      S3_CONNECT_TIMEOUT_SECONDS:
      S3_READ_TIMEOUT_SECONDS:
      S3_MAX_LISTED_OBJECTS:
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).close()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - qc_tool_v3_boundaries:/mnt/qc-tool/data/boundaries
      - qc_tool_v3_incoming:/mnt/qc-tool/data/incoming
      - qc_tool_v3_specifications:/mnt/qc-tool/data/specifications
      - qc_tool_v3_jobs:/mnt/qc-tool/data/jobs
      - qc_tool_v3_submissions:/mnt/qc-tool/data/submissions
      - qc_tool_v3_shared_state:/mnt/qc-tool/state/shared
      - qc_tool_v3_frontend_logs:/var/log/qc-tool
      - qc_tool_v3_frontend_state:/var/lib/qc_tool
      - type: bind
        source: ..
        target: /usr/local/src/copernicus_quality_tools
        read_only: true
        bind:
          create_host_path: false

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      args:
        VERSION: "${QC_TOOL_SOURCE_VERSION:-development}"
    image: "copernicus-qctool-worker-local:${QC_TOOL_IMAGE_TAG:-dev}"
    init: true
    # Builds natively; compose.platform.yaml optionally selects another CPU.
    pull_policy: missing
    shm_size: 1gb
    depends_on:
      frontend:
        condition: service_healthy
        restart: true
    environment:
      QC_TOOL_DATA_ROOT: /mnt/qc-tool/data
      QC_TOOL_REQUIRE_MOUNTS: "yes"
      QC_TOOL_STORAGE_ROLE: worker
      PULL_JOB_URL: http://frontend:8000/pull_job
      RUN_INSPIRE_VALIDATOR: "yes"
      USE_LIGHTWEIGHT_VALIDATOR: "no"
      RUN_POSTGRES: "yes"
      JAVA_MAX_MEM: "1536"
      # Existing worker overrides; no frontend secrets or private paths.
      PRODUCT_DIRS:
      S3_MAX_DOWNLOAD_BYTES:
      LEAVE_SCHEMA:
      LEAVE_JOBDIR:
      S3_ALLOWED_ENDPOINTS:
      S3_CONNECT_TIMEOUT_SECONDS:
      S3_READ_TIMEOUT_SECONDS: "${S3_READ_TIMEOUT_SECONDS:-10}"
      S3_MAX_LISTED_OBJECTS:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:8000/health >/dev/null &&
          curl -fsS http://localhost:8080/validator/v2/status >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    volumes:
      - qc_tool_v3_boundaries:/mnt/qc-tool/data/boundaries:ro
      - qc_tool_v3_incoming:/mnt/qc-tool/data/incoming:ro
      - qc_tool_v3_specifications:/mnt/qc-tool/data/specifications:ro
      - qc_tool_v3_jobs:/mnt/qc-tool/data/jobs
      - qc_tool_v3_shared_state:/mnt/qc-tool/state/shared
      - qc_tool_v3_worker_logs:/var/log/qc-tool
      - qc_tool_v3_worker_scratch:/var/tmp/qc-tool/jobs
      - type: bind
        source: ..
        target: /usr/local/src/copernicus_quality_tools
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres17_data_v3:
  qc_tool_v3_boundaries:
  qc_tool_v3_incoming:
  qc_tool_v3_specifications:
  qc_tool_v3_jobs:
  qc_tool_v3_submissions:
  qc_tool_v3_shared_state:
  qc_tool_v3_frontend_state:
  qc_tool_v3_worker_scratch:
  qc_tool_v3_frontend_logs:
  qc_tool_v3_worker_logs:
